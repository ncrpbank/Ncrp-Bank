<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Anmeldung</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="wrapper">
        <form id="registerForm">
            <h1>Registrierung</h1>
            <div class="input-box">
                <input type="text" id="regUsername" placeholder="Benutzername" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="password" id="regPassword" placeholder="Passwort" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <button type="submit" class="btn">Registrieren</button>
            <p>Bereits ein Konto? <a href="#" onclick="showLogin()">Anmelden</a></p>
        </form>

        <form id="loginForm" style="display:none;">
            <h1>Anmeldung</h1>
            <div class="input-box">
                <input type="text" id="loginUsername" placeholder="Benutzername" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="password" id="loginPassword" placeholder="Passwort" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <button type="submit" class="btn">Anmelden</button>
            <p>Noch kein Konto? <a href="#" onclick="showRegister()">Registrieren</a></p>
        </form>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const storedPassword = localStorage.getItem(username);
            
            if (storedPassword && storedPassword === password) {
                alert('Anmeldung erfolgreich!');
    
                // Weiterleitung basierend auf Benutzername
                if (username === 'admin') {
                    window.location.href = 'https://docs.google.com/document/d/1cViFGNPQm7S69elN7X_QSZfK_Mvf1I8kD0PwkCkXEFM/edit?usp=sharing';
                } 
                else if (username === 'gustav') {
                    window.location.href = 'https://docs.google.com/document/d/1NyL-x5iYbhSyk__rxNAmWq57CH500gslS5D6sN3dsDA/edit?usp=sharing';
                } 
                else if (username === 'Mer') {
                    window.location.href = 'https://docs.google.com/document/d/1cViFGNPQm7S69elN7X_QSZfK_Mvf1I8kD0PwkCkXEFM/edit?usp=sharing';
                }
            } else {
                alert('Falscher Benutzername oder Passwort!');
            }
        });
    </script>
</body>
</html>
